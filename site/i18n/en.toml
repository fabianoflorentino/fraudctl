node_lb = "fraudctl-lb"
node_apis = "2 instances"
node_index = "grid.bin"
node_index_sub = "KD-tree · ~88 MB"
lb_code = "TCP :9999"
fd_code = "SCM_RIGHTS"
index_code = "PredictRaw"
caption = "The LB never reads the payload: it only distributes connections round-robin and hands the socket to the API."
callout = "With no HTTP proxy between load balancer and API, the critical path removes an entire layer of request parsing and copying."
note1_title = "LB without HTTP proxy"
note1_text = "The socket is transferred via SCM_RIGHTS and the API talks directly to the client."
note2_title = "Purpose-built server"
note2_text = "Byte-oriented HTTP parser, sync.Pool buffers, and pre-built responses."
note3_title = "In-memory index"
note3_text = "grid.bin generated at build time: 3M int16 vectors in ~88 MB."

[pipeline]
eyebrow = "Request path"
title = "From transaction to decision in 8 steps"
sub = "Each step was designed to avoid allocations and unnecessary work on the hot path."
s1_title = "Manual HTTP parse"
s1_text = "Byte-oriented server with sync.Pool buffers, byte-level routing, and no net/http."
s2_title = "Single-pass JSON"
s2_text = "A manual parser extracts only the required fields without deserializing the entire struct."
s3_title = "14-dimensional vector"
s3_text = "Normalized features using precomputed inverse multiplication, with no division on the hot path."
s4_title = "int16 quantization"
s4_text = "Scale 10000 shrinks the index from ~168 MB (float32) to ~88 MB, fitting the memory limit."
s5_title = "Partition key"
s5_text = "8 bits derived from transaction features select a partition with O(1) lookup."
s6_title = "Per-partition KD-tree"
s6_text = "Median split on the widest dimension, 128-vector leaves, and bounding-box pruning."
s7_title = "AVX2 scan"
s7_text = "Assembly processes 8 vectors per block with early exit at dimension 8 and next-block prefetch."
s8_title = "Ready response"
s8_text = "Six precomputed JSON responses cover every possible fraud_score value."

