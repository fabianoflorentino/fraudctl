[arch]
eyebrow = "Architecture"
title = "Custom load balancer, no HTTP proxy"
sub = "fraudctl-lb accepts the TCP connection and transfers the file descriptor to one of the APIs via SCM_RIGHTS. The API talks directly to the client through a byte-oriented HTTP server."
