col_impact = "Impacto"
opt1_name = "Partição O(1)"
opt1_impact = "−192 comparações por request"
opt2_name = "Bounds em int16"
opt2_impact = "−14 conversões f32 por partição"
opt3_name = "Kernel AVX2"
opt3_impact = "8 vetores simultâneos por bloco"
opt4_name = "Respostas pré-computadas"
opt4_impact = "0 alocação no hot path"
opt5_name = "PGO + GOGC off"
opt5_impact = "menos pausas de GC"
callout = "Benchmark do índice: 0 B/op e 0 allocs/op no caminho de predição."

[go]
eyebrow = "Go idiomático"
title = "Performance sem abrir mão de engenharia"
sub = "O projeto é agressivo no hot path, mas segue convenções: pacotes pequenos, interfaces no consumidor, erros explícitos e testes com race detector."
c1_title = "Zero alocação"
c1_text = "Todos os buffers são reutilizados e as respostas são construídas uma única vez, no init."
c2_title = "sync.Pool"
c2_text = "Buffers de leitura do servidor HTTP são reciclados entre conexões para reduzir pressão no GC."
c3_title = "Testes com -race"
c3_text = "Testes table-driven cobrem vectorizer, índice, handler, rawhttp e passagem de file descriptor."
c4_title = "CI e lint"
c4_text = "Build, testes, vet, golangci-lint, imagens Docker e validações rodam em GitHub Actions."
c5_title = "Distroless e non-root"
c5_text = "Imagem final mínima, sem shell, com usuário não-root e binário estático em CGO desligado."
c6_title = "Build-time e PGO"
c6_text = "O índice é gerado no build da imagem e o binário usa perfil PGO coletado do próprio workload."

