[challenge]
eyebrow = "O desafio"
title = "Busca vetorial sob restrições extremas"
sub = "Para cada transação, transformar o payload em um vetor, buscar os 5 vizinhos mais próximos e decidir em milissegundos — dentro de 1 CPU e 350 MB."
c1_title = "3 milhões de vetores"
c1_text = "Base de referência rotulada como fraude ou legítima, com 14 dimensões por transação."
c2_title = "14 dimensões"
c2_text = "Valor, parcelas, horário, distância, MCC e comerciante conhecido — normalizados para o intervalo [0,1]."
c3_title = "K = 5"
c3_text = "fraud_score é a fração de fraudes entre os 5 vizinhos. A transação é aprovada quando o score fica abaixo de 0,6."
c4_title = "1 CPU · 350 MB"
c4_text = "Limite somado de todos os serviços: load balancer e duas instâncias da API, em rede bridge."

[arch]
eyebrow = "Arquitetura"
title = "Load balancer próprio, sem proxy HTTP"
sub = "O fraudctl-lb aceita a conexão TCP e transfere o file descriptor para uma das APIs via SCM_RIGHTS. A API conversa direto com o cliente usando um servidor HTTP orientado a bytes."
node_client = "Cliente"
node_lb = "fraudctl-lb"
node_apis = "2 instâncias"
node_index = "grid.bin"
node_index_sub = "KD-tree · ~88 MB"
lb_code = "TCP :9999"
fd_code = "SCM_RIGHTS"
index_code = "PredictRaw"
caption = "O LB não lê o payload: apenas distribui conexões em round-robin e entrega o socket para a API."
callout = "Sem proxy HTTP entre load balancer e API, o caminho crítico elimina uma camada inteira de parsing e cópia de request."
note1_title = "LB sem proxy HTTP"
note1_text = "O socket é transferido via SCM_RIGHTS e a API fala direto com o cliente."
note2_title = "Servidor sob medida"
note2_text = "Parser HTTP orientado a bytes, buffer via sync.Pool e respostas pré-montadas."
note3_title = "Índice em memória"
note3_text = "grid.bin gerado no build: 3M vetores em int16 e ~88 MB."

[pipeline]
eyebrow = "Caminho da requisição"
title = "Da transação à decisão em 8 passos"
sub = "Cada etapa foi desenhada para evitar alocação e trabalho desnecessário no hot path."
s1_title = "Parse HTTP manual"
s1_text = "Servidor orientado a bytes com buffer via sync.Pool, roteamento por bytes e sem net/http."
s2_title = "JSON em uma passada"
s2_text = "Parser manual extrai apenas os campos necessários, sem desserializar a struct inteira."
s3_title = "Vetor de 14 dimensões"
s3_text = "Features normalizadas com multiplicação por inverso pré-computado, sem divisão no hot path."
s4_title = "Quantização int16"
s4_text = "Escala 10000 reduz o índice de ~168 MB (float32) para ~88 MB, cabendo no limite de memória."
s5_title = "Chave de partição"
s5_text = "8 bits derivados das features da transação selecionam uma partição com lookup O(1)."
s6_title = "KD-tree por partição"
s6_text = "Median split na dimensão mais larga, folhas de 128 vetores e poda por bounding box."
s7_title = "Scan AVX2"
s7_text = "Assembly processa 8 vetores por bloco com early exit na dimensão 8 e prefetch do próximo bloco."
s8_title = "Resposta pronta"
s8_text = "Seis respostas JSON pré-computadas cobrem todos os valores possíveis de fraud_score."

[perf]
eyebrow = "Performance"
title = "Onde cada microssegundo foi conquistado"
sub = "Latência é metade do score. O índice exato, o parser manual e o SIMD levaram o p99 a 1,16 ms."
score_title = "Composição do score"
score_latency = "Latência (p99)"
score_detection = "Detecção"
score_total = "Total"
table_title = "Otimizações que moveram o ponteiro"
