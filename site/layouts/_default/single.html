{{ define "main" }}
<div class="doc-wrap">
  {{ if eq .Section "docs" }}
  <aside class="doc-aside">
    <p class="doc-label">{{ i18n "docs.label" }}</p>
    <nav class="doc-nav" aria-label="{{ i18n "docs.label" }}">
      {{ $section := .Site.GetPage "section" "docs" }}
      {{ range $section.Pages.ByWeight }}
      <a href="{{ .RelPermalink }}"{{ if eq $.RelPermalink .RelPermalink }} class="is-active"{{ end }}>{{ .Title }}</a>
      {{ end }}
    </nav>
  </aside>
  {{ end }}

  <article class="doc-body">
    <header class="doc-header">
      <h1 class="reveal">{{ .Title }}</h1>
      {{ with .Params.description }}<p class="doc-desc reveal">{{ . }}</p>{{ end }}
    </header>
    <div class="reveal">
      {{ .Content }}
    </div>
  </article>
</div>
{{ end }}
