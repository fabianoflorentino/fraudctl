<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "pt-BR" }}">
  {{ partial "head.html" . }}
  <body class="{{ if .IsHome }}home{{ else }}inner{{ end }}">
    {{ partial "header.html" . }}
    <main id="main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    <button class="to-top" id="to-top" aria-label="{{ i18n "nav.back_to_top" | default "Voltar ao topo" }}">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 19V5M5 12l7-7 7 7"/>
      </svg>
    </button>
    <script src="{{ "js/main.js" | relURL }}" defer></script>
  </body>
</html>
