<header class="topbar" id="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ .Site.Home.RelPermalink }}" aria-label="{{ i18n "nav.logo_home" }}">
      <span class="brand-mark" aria-hidden="true">fc</span>
      <span>fraudctl</span>
    </a>

    <button class="burger" id="burger" aria-label="Menu" aria-expanded="false" aria-controls="nav">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav" id="nav" aria-label="{{ i18n "nav.aria" }}">
      {{ range .Site.Menus.main }}
      {{ $active := or (eq $.RelPermalink .URL) (and (eq .URL "/docs/") (eq $.Section "docs")) }}
      <a class="nav-link" href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
      <a class="nav-gh" href="{{ .Site.Params.github }}" target="_blank" rel="noopener">{{ i18n "nav.github" }} ↗</a>
    </nav>
  </div>
</header>
