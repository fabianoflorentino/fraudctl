baseURL = "https://fraudctl.fabianoflorentino.dev/"
title = "fraudctl"
defaultContentLanguage = "pt"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  author = "Fabiano Santos Florentino"
  github = "https://github.com/fabianoflorentino/fraudctl"
  linkedin = "https://www.linkedin.com/in/fabianosantosflorentino"
  rinha = "https://rinhadebackend.com.br/"
  edition = "Rinha de Backend 2026"
  rank = "19º"
  license = "MIT"
  license_url = "https://github.com/fabianoflorentino/fraudctl/blob/main/LICENSE"

[languages]
  [languages.pt]
    label = "Português"
    locale = "pt-BR"
    weight = 1
    [languages.pt.params]
      description = "Detecção de fraude por busca vetorial em Go — 19º lugar na Rinha de Backend 2026."
      tagline = "3 milhões de vetores. 1,16 ms. Zero erros."
      subtitle = "Uma API em Go puro que transforma transações em vetores de 14 dimensões e busca os 5 vizinhos mais próximos entre 3 milhões de referências."
    [[languages.pt.menu.main]]
      name = "Desafio"
      url = "/#desafio"
      weight = 1
    [[languages.pt.menu.main]]
      name = "Arquitetura"
      url = "/#arquitetura"
      weight = 2
    [[languages.pt.menu.main]]
      name = "Performance"
      url = "/#performance"
      weight = 3
    [[languages.pt.menu.main]]
      name = "Docs"
      url = "/docs/"
      weight = 4

  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 2
    [languages.en.params]
      description = "Vector search fraud detection in Go — 19th place at Rinha de Backend 2026."
      tagline = "3 million vectors. 1.16 ms. Zero errors."
      subtitle = "A pure-Go API that turns transactions into 14-dimensional vectors and searches the 5 nearest neighbors among 3 million references."
    [[languages.en.menu.main]]
      name = "Challenge"
      url = "/en/#desafio"
      weight = 1
    [[languages.en.menu.main]]
      name = "Architecture"
      url = "/en/#arquitetura"
      weight = 2
    [[languages.en.menu.main]]
      name = "Performance"
      url = "/en/#performance"
      weight = 3
    [[languages.en.menu.main]]
      name = "Docs"
      url = "/en/docs/"
      weight = 4

[markup]
  [markup.highlight]
    style = "github-dark"
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
